<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScrollConnect - DevOps Day 3</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    h1 { color: #38bdf8; margin-bottom: 8px; font-size: 28px; }
    p { color: #94a3b8; font-size: 16px; line-height: 1.6; }
    .badge {
      display: inline-block;
      background: #0284c7;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin: 6px 4px;
    }
    .footer { margin-top: 24px; font-size: 14px; color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 ScrollConnect DevOps</h1>
    <p>Day 3: Docker, WSL & Cloud Deployment</p>
    <div>
      <span class="badge">🐳 Docker Desktop</span>
      <span class="badge">🐧 WSL2 / Ubuntu</span>
      <span class="badge">☁️ Vercel Live</span>
    </div>
    <div class="footer">Deployed successfully by <strong>Alihana</strong> ✨</div>
  </div>
</body>
</html>
